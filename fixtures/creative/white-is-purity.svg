<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- Synthetic creative for Second Look. Fictional brand "Clearday". -->
  <rect width="1080" height="1350" fill="#D8CEC1"/>

  <!-- Wordmark -->
  <text x="540" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" letter-spacing="12" fill="#1E2A33">CLEARDAY</text>
  <text x="540" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="6" fill="#4A5561">INVISIBLE FOR BLACK &amp; WHITE</text>

  <!-- Bright window -->
  <rect x="420" y="200" width="560" height="880" fill="#F4EFE6"/>
  <rect x="444" y="224" width="512" height="832" fill="#E6F1F8"/>
  <path d="M444 224 L700 224 L444 700 Z" fill="#FFFFFF" opacity="0.7"/>
  <rect x="692" y="224" width="16" height="832" fill="#F4EFE6"/>
  <rect x="444" y="632" width="512" height="16" fill="#F4EFE6"/>
  <rect x="930" y="190" width="90" height="900" fill="#F1ECE3"/>
  <line x1="960" y1="200" x2="960" y2="1080" stroke="#DDD5C9" stroke-width="4"/>
  <line x1="992" y1="200" x2="992" y2="1080" stroke="#DDD5C9" stroke-width="4"/>
  <!-- Sill and floor -->
  <rect x="400" y="1076" width="600" height="22" fill="#EDE6DB"/>
  <rect x="0" y="1210" width="1080" height="140" fill="#C8BBAA"/>

  <!-- Woman seen from behind, white robe -->
  <path d="M362 566 Q370 520 426 506 L514 506 Q570 520 578 566 L630 1350 L310 1350 Z" fill="#FDFDFB" stroke="#CFC8BD" stroke-width="3"/>
  <g stroke="#E4DFD6" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M410 960 Q402 1150 396 1340"/>
    <path d="M470 960 L470 1340"/>
    <path d="M532 960 Q540 1150 546 1340"/>
  </g>
  <path d="M338 900 L602 900 L605 944 L335 944 Z" fill="#F1EFEA" stroke="#CFC8BD" stroke-width="3"/>
  <!-- Sleeves (arms folded in front, hands not visible) -->
  <path d="M372 548 Q326 590 322 720 L318 960 Q342 978 372 970 L384 760 Z" fill="#F8F7F3" stroke="#CFC8BD" stroke-width="3"/>
  <path d="M568 548 Q614 590 618 720 L622 960 Q598 978 568 970 L556 760 Z" fill="#F8F7F3" stroke="#CFC8BD" stroke-width="3"/>
  <path d="M320 930 Q344 946 374 938" fill="none" stroke="#CFC8BD" stroke-width="3"/>
  <path d="M620 930 Q596 946 566 938" fill="none" stroke="#CFC8BD" stroke-width="3"/>
  <!-- Dark hair cascading down her back -->
  <ellipse cx="470" cy="392" rx="88" ry="100" fill="#2E211B"/>
  <path d="M386 400 Q376 560 392 740 Q420 772 448 752 Q470 780 494 752 Q522 772 548 740 Q566 560 554 400 Z" fill="#2E211B"/>
  <path d="M420 440 Q412 600 424 720" fill="none" stroke="#4A3A31" stroke-width="5" stroke-linecap="round"/>
  <path d="M500 440 Q512 600 506 720" fill="none" stroke="#4A3A31" stroke-width="5" stroke-linecap="round"/>

  <!-- Product: deodorant stick on the floor -->
  <ellipse cx="850" cy="1302" rx="96" ry="12" fill="#B3A594"/>
  <rect x="780" y="1060" width="140" height="92" rx="16" fill="#141414"/>
  <rect x="780" y="1140" width="140" height="160" rx="16" fill="#FFFFFF" stroke="#CFC8BD" stroke-width="3"/>
  <rect x="780" y="1140" width="140" height="10" fill="#141414"/>
  <text x="850" y="1216" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#141414">CLEARDAY</text>
  <text x="850" y="1246" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6B737B">INVISIBLE</text>
</svg>

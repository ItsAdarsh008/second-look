<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- Synthetic creative for Second Look. Fictional brand "Harbor Coffee Korea". -->
  <defs>
    <g id="leaf">
      <path d="M0 -64 Q46 -18 0 64 Q-46 -18 0 -64 Z"/>
      <path d="M0 -48 L0 60" stroke="#7A2E1A" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
    </g>
  </defs>
  <rect width="1080" height="1350" fill="#F3E6D2"/>

  <!-- Wordmark -->
  <circle cx="540" cy="92" r="42" fill="#22335A"/>
  <path d="M511 86 q14.5 -12 29 0 t29 0 M511 103 q14.5 -12 29 0 t29 0" fill="none" stroke="#F3E6D2" stroke-width="6" stroke-linecap="round"/>
  <text x="540" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="8" fill="#22335A">HARBOR COFFEE</text>
  <text x="540" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="12" fill="#4A5A7C">KOREA</text>

  <!-- Autumn leaves -->
  <use xlink:href="#leaf" fill="#D9652B" transform="translate(150 470) rotate(32) scale(1.3)"/>
  <use xlink:href="#leaf" fill="#E8A13A" transform="translate(930 420) rotate(-40) scale(1.2)"/>
  <use xlink:href="#leaf" fill="#B84A2A" transform="translate(960 760) rotate(18) scale(1.4)"/>
  <use xlink:href="#leaf" fill="#E8A13A" transform="translate(120 760) rotate(-24) scale(1.1)"/>
  <use xlink:href="#leaf" fill="#D9652B" transform="translate(900 1080) rotate(70) scale(1.2)"/>

  <!-- Saucer -->
  <ellipse cx="540" cy="1052" rx="300" ry="54" fill="#FFFDF8" stroke="#DCCDB6" stroke-width="4"/>
  <ellipse cx="540" cy="1046" rx="190" ry="30" fill="#EFE5D6"/>

  <!-- Cup -->
  <path d="M772 770 C880 770 880 930 740 944" fill="none" stroke="#22335A" stroke-width="32" stroke-linecap="round"/>
  <path d="M330 700 L750 700 Q746 990 610 1044 L470 1044 Q334 990 330 700 Z" fill="#22335A"/>
  <path d="M362 740 Q372 930 440 1000" fill="none" stroke="#3A4F82" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="540" cy="700" rx="210" ry="52" fill="#FFFDF8"/>
  <ellipse cx="540" cy="704" rx="188" ry="40" fill="#C9936F"/>
  <path d="M540 736 C480 712 492 676 520 680 C532 682 538 690 540 696 C542 690 548 682 560 680 C588 676 600 712 540 736 Z" fill="#F4E6D3"/>
  <circle cx="540" cy="868" r="56" fill="#F3E6D2"/>
  <path d="M504 860 q18 -15 36 0 t36 0 M504 882 q18 -15 36 0 t36 0" fill="none" stroke="#22335A" stroke-width="7" stroke-linecap="round"/>

  <!-- Roasted sweet potato -->
  <g transform="translate(250 1160) rotate(-12)">
    <ellipse cx="0" cy="0" rx="178" ry="68" fill="#7B2D3E"/>
    <ellipse cx="14" cy="-10" rx="122" ry="36" fill="#F2A93B"/>
    <ellipse cx="14" cy="-10" rx="96" ry="22" fill="#F7C064"/>
    <ellipse cx="-138" cy="14" rx="18" ry="8" fill="#5A1E2B"/>
    <ellipse cx="150" cy="22" rx="14" ry="7" fill="#5A1E2B"/>
    <ellipse cx="-60" cy="44" rx="22" ry="7" fill="#5A1E2B"/>
  </g>

  <!-- Bottom band -->
  <rect x="0" y="1240" width="1080" height="110" fill="#22335A"/>
  <text x="540" y="1310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" letter-spacing="6" fill="#F3E6D2">SWEET POTATO LATTE</text>
</svg>

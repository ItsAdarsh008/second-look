<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- Synthetic creative for Second Look. Fictional brand "Volt". -->
  <defs>
    <polygon id="ray" points="0,0 2189.4,-215.6 2189.4,215.6" fill="#C8102E"/>
  </defs>
  <rect width="1080" height="1350" fill="#FFFFFF"/>

  <!-- 16 red rays alternating with white, radiating from an off-center red disc -->
  <g transform="translate(460 520)">
    <use xlink:href="#ray" transform="rotate(0)"/>
    <use xlink:href="#ray" transform="rotate(22.5)"/>
    <use xlink:href="#ray" transform="rotate(45)"/>
    <use xlink:href="#ray" transform="rotate(67.5)"/>
    <use xlink:href="#ray" transform="rotate(90)"/>
    <use xlink:href="#ray" transform="rotate(112.5)"/>
    <use xlink:href="#ray" transform="rotate(135)"/>
    <use xlink:href="#ray" transform="rotate(157.5)"/>
    <use xlink:href="#ray" transform="rotate(180)"/>
    <use xlink:href="#ray" transform="rotate(202.5)"/>
    <use xlink:href="#ray" transform="rotate(225)"/>
    <use xlink:href="#ray" transform="rotate(247.5)"/>
    <use xlink:href="#ray" transform="rotate(270)"/>
    <use xlink:href="#ray" transform="rotate(292.5)"/>
    <use xlink:href="#ray" transform="rotate(315)"/>
    <use xlink:href="#ray" transform="rotate(337.5)"/>
    <circle cx="0" cy="0" r="215" fill="#C8102E"/>
  </g>

  <!-- Can -->
  <rect x="436" y="628" width="208" height="34" rx="12" fill="#C9CED5"/>
  <rect x="424" y="652" width="232" height="520" rx="26" fill="#17171C"/>
  <rect x="446" y="680" width="20" height="464" rx="10" fill="#FFFFFF" opacity="0.10"/>
  <rect x="436" y="1160" width="208" height="30" rx="12" fill="#AEB4BC"/>

  <text x="540" y="770" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="700" fill="#FFD21F">VOLT</text>
  <circle cx="540" cy="880" r="62" fill="#FFD21F"/>
  <circle cx="540" cy="880" r="50" fill="#FFF0A6"/>
  <g stroke="#FFD21F" stroke-width="6" stroke-linecap="round">
    <line x1="540" y1="834" x2="540" y2="926"/>
    <line x1="494" y1="880" x2="586" y2="880"/>
    <line x1="507" y1="847" x2="573" y2="913"/>
    <line x1="573" y1="847" x2="507" y2="913"/>
  </g>
  <circle cx="540" cy="880" r="7" fill="#FFD21F"/>
  <text x="540" y="1010" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" letter-spacing="4" fill="#FFFFFF">CITRUS</text>
  <text x="540" y="1052" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#B9BEC6">ZERO SUGAR</text>

  <!-- Bottom band -->
  <rect x="0" y="1240" width="1080" height="110" fill="#17171C"/>
  <text x="540" y="1308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" letter-spacing="6" fill="#FFFFFF">VOLT CITRUS</text>
</svg>

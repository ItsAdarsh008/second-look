<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Second Look">
  <!--
    The mark Second Look draws on a creative: the flagged region, and the badge numbering it.
    Same geometry and palette as the report's finding overlay (pencil #2750b8 on paper #f3f4f1),
    so the tab icon and the product are recognisably the same object. Carries its own background
    rather than going transparent, so it holds up on a light or a dark tab strip.
  -->
  <rect width="64" height="64" rx="13" fill="#f3f4f1"/>
  <rect x="17.5" y="17.5" width="33" height="33" rx="3.5" fill="#e2e9f7" stroke="#2750b8" stroke-width="5"/>
  <rect x="8" y="8" width="17" height="17" rx="2.5" fill="#2750b8"/>
</svg>

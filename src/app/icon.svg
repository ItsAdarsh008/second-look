<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Second Look">
  <!--
    The mark Second Look draws on a creative: the badge, the region it flags, and the number of the
    finding — 2, for the second look. Same geometry and palette as the report's finding overlay
    (pencil #2750b8 on paper #f3f4f1), so the tab icon and the product are recognisably the same
    object. Carries its own background rather than going transparent, so it holds up on a light or
    a dark tab strip. Mirrored by src/components/mark.tsx — change one, change the other.

    The numeral sits inside the region rather than the badge: the region is twice the width, which
    is the difference between a legible 2 and a smudge at 16px.
  -->
  <rect width="64" height="64" rx="13" fill="#f3f4f1"/>
  <rect x="7" y="7" width="16" height="16" rx="2.5" fill="#2750b8"/>
  <rect x="19.5" y="19.5" width="35" height="35" rx="3.5" fill="#e2e9f7" stroke="#2750b8" stroke-width="5"/>
  <path fill="#2750b8" transform="translate(20.5 21.4)" d="M9.7 11.9c.2-3.4 2.9-5.6 6.8-5.6 3.8 0 6.5 2.2 6.5 5.4 0 2.2-1.1 3.9-4 6.6l-3.6 3.4v.2h7.8V25H9.8v-2.7l6.4-6.1c1.9-1.8 2.5-2.7 2.5-3.8 0-1.4-1-2.4-2.5-2.4-1.6 0-2.6 1-2.6 2.5v.2H9.7v-.8Z"/>
</svg>
